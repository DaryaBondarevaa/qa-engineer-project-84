---
- summary: |
    Проверка добавления товара во вкладку "Cart" (корзина)
  requirement: |
    При нажатии кнопки "Добавить в корзину" у товара, товар добавляется в корзину
  prerequisites: |
    no-data
  test-data: |
    no-data
  steps:
    - У нескольких товаров наживаем кнопку "Добавить в корзину"
    - Переходим во вкладку корзина
  expected-result: |
    При нажатии кнопки "Добавить в корзину", выбранный товар добавляется в корзину

- summary: |
    Проверка изменения английского языка магазина на русский
  requirement: |
    При нажатии на вкладку "Language" (язык) появляется возможность выбора русского языка для магазина
  prerequisites:
    no-data
  test-data: |
    no-data
  steps:
    - Нажимаем на вкладку "Language" (язык)
    - Нажимаем Russian
  expected-result: |
    Язык на странице изменяется с английского на русский

- summary: |
    Проверка перехода из вкладки "Cart" (корзина) на главную страницу магазина
  requirement: |
    При нажатии на вкладку "Store" (магазин), пользователь попадает на главную страницу магазина
  prerequisites:
    no-data
  test-data: |
    no-data
  steps:
    - Открываем вкладку "Cart" (корзина) 
    - Нажимаем на вкладку "Store" (магазин)
  expected-result: |
   Пользователь должен попасть на главную страницу магазина 

- summary: |
    Проверка работы функции "Очистить корзину"
  requirement: |
    При нажатии на кнопку "Очистить корзину" во вкладке "корзина" удаляются выбранные товары
  prerequisites:
    no-data
  test-data: |
    no-data
  steps:
    - Добавляем в корзину несколько товаров
    - Переходим во вкладку "корзина"
    - Нажимаем "Очистить корзину"
  expected-result: |
    Все товары из корзины удаляются

- summary: |
    Проверка перехода по страницам каталога
  requirement: |
    При нажатии на кнопки "Следующая" и "Предыдущая" происходит переход на другую страницу каталога
  prerequisites:
    no-data
  test-data: |
    no-data
  steps:
    - Нажимаем на кнопку "Следующая"
    - Нажимаем на кнопку "Предыдущая"
  expected-result: |
    Пользователь должен попасть на следующую старницу каталога

- summary: |
    Проверка поиска товаров по бренду
  requirement: |
    При выборе бренда, отображаются только товары данного бренда
  prerequisites:
    no-data
  test-data: |
    no-data
  steps:
    - В разделе бренд ставим галочку "Dior"
    - В разделе бренд ставим галочку "Gucci"
  expected-result: |
    Отображаются товары выбранного бренда

- summary: |
    Проверка отображения всех товаров каталога
  requirement: |
    При выборе функции "В наличии" или снятии функции "В наличии" отображаются все товары каталога
  prerequisites:
    no-data
  test-data: |
    no-data
  steps:
    - Ставим галочку "В наличии"
    - Убираем галочку "В наличии"
  expected-result: |
    Отображаются все товары каталога

- summary: |
    Проверка фильтрации товара по цене
  requirement: |
    При выборе диапазона цены на странице остаются только те товары, которые подходят под выбраный диапазон
  prerequisites:
    no-data
  test-data: |
    no-data
  steps:
    - В разделе цена выбираем диапазон от 0 до 500
  expected-result: |
    Пользователь видит товар в указанном им ценовом диапазоне

- summary: |
    Проверка поиска по ключевому слову
  requirement: |
   При введении букв в строке поиск происходит поиск товаров содержащих в названии и описании данные значения
  prerequisites:
    no-data
  test-data: |
    no-data
  steps:
    - Ввести любое ключевому слово, например - Bed
  expected-result: |
    Отображаются товары согласно введенного запроса

- summary: |
    Проверка оформления заказа
  requirement: |
    При нажатии в корзине кнопки "Оформить заказ" появляется окно оформления заказа
  prerequisites:
    no-data
  test-data: |
    no-data
  steps:
    - Нажимаем кнопку "Добавить в корзину" у трех товаров
    - Переходим в раздел корзина
    - Нажимаем кнопку "Оформить заказ"
  expected-result: |
    Заказ успешно оформлен

- summary: |
    Проверка суммирования стоимости заказа
  requirement: |
    При добавлении нескольких товаров в корзину происходит суммирование стоимости заказа
  prerequisites:
    no-data
  test-data: |
    no-data
  steps:
    - Нажимаем кнопку "Добавить в корзину" у трех товаров
    - Переходим в раздел корзина
  expected-result: |
    При добавлении нескольких товаров в корзину, происходит суммирование стоимости заказа

- summary: |
    Проверка удаления товара из корзины
  requirement: |
    При нажатии кнопки удаления товара, удаляется выбранный товар из корзины
  prerequisites:
    no-data
  test-data: |
    no-data
  steps:
    - Нажимаем кнопку "Добавить в корзину" у трех товаров
    - Переходим в раздел корзина
    - У одного из товаров нажимаем кнопку "Удалить товар"
  expected-result: |
    При нажатии кнопки "Удалить товар" у конкретного товара происходит его удаление из корзины

- summary: |
    Проверка отображения картинок товара
  requirement: |
    Отсутствие искажения изображения товара
  prerequisites:
    no-data
  test-data: |
    no-data
  steps:
    - Проверяем отображение картинок у некоторых товаров, например Cooking Oil
    - Открываем карточку товара Cooking Oil
  expected-result: |
    На главной странице магазина изображение товара искажено, при открытии карточки товара изображение изменяется. 
