---
test-cases:
  - summary: |
      Проверка отображения всех товаров каталога
    status: fail

- summary: |
    Проверка отображения картинок товара
    status: fail

- summary: |
    Проверка автоудаления товаров из корзины после оформелния заказа
    status: fail

- summary: |
    Не работает счетчик количества товара в наличии
    status: fail

bugreports:
  - summary: |
      Проверка отображения всех товаров каталога
    environment: |
      Microsoft Edge 126.0.2592.68 (Официальная сборка) (64-разрядная версия)
      ОС Windows 23H2
    steps-to-reproduce: |
      1. Ставим галочку "В наличии"
      2. Убираем галочку "В наличии"
    expected-result: |
      Отображаются все товары каталога
    actual-result: |
      Не отображаются товары, которых нет в наличии

  - summary: |
      Проверка отображения картинок товара
    environment: |
      Microsoft Edge 126.0.2592.68 (Официальная сборка) (64-разрядная версия)
      ОС Windows 23H2
    steps-to-reproduce: |
      1. Проверяем отображение картинок у некоторых товаров, например Cooking Oil
      2. Открываем карточку товара Cooking Oil
    expected-result: |
      Картинка товара не должна искажаться на главной странице магазина
    actual-result: |
      На главной странице магазина изображение товара искажено, при открытии карточки товара изображение изменяется.

  - summary: |
      Проверка автоудаления товаров из корзины после оформелния заказа
    environment: |
      Microsoft Edge 126.0.2592.68 (Официальная сборка) (64-разрядная версия)
      ОС Windows 23H2
    steps-to-reproduce: |
      1. Добавляем любой товар в корзину
      2. Переходим в корзину
      3. Оформляем заказ
    expected-result: |
      После оформления заказа, товар должен автоматически удаляться из корзины
    actual-result: |
      После оформления заказа, товар не удаляется автоматически из корзины. DevTools - ошибка 500.

  - summary: |
      Не работает счетчик количества товара в наличии
    environment: |
      Microsoft Edge 126.0.2592.68 (Официальная сборка) (64-разрядная версия)
      ОС Windows 23H2
    steps-to-reproduce: |
      1. Добавляем любой товар в корзину
      2. Переходим в корзину
      3. Оформляем заказ
      4. Возвращаемся на главную страницу магазина
      5. Открываем карточку ранее выбранного товара
    expected-result: |
      После оформления заказа, количество товара в наличии должно уменьшаться
    actual-result: |
      После оформления заказа, количество товара "В наличии" не уменьшилось.
