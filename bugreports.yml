- summary: |
Не работает автоудаление товаров из корзины после оформелния заказа
environment: |
Microsoft Edge 126.0.2592.68 (Официальная сборка) (64-разрядная версия)
ОС Windows 23H2
steps-to-reproduce: |
1. Зайти на сайт магазина https://hexlet-products-store.vercel.app/
2. Добавить в корзину 3 товара
3. Перейти в корзину нажав кнопку "Cart"
4. Оформить заказ нажав на кнопку "Checkout"
5. Выйти из формы оформления заказа нажав на кнопку "Close"
6. Перейти на главную страницу магазина нажав на вкладку "Store"
7. Перейти в корзину нажав кнопку "Cart"
expected-result: |
Товар должен автоматически удаляться из корзины после оформления заказа
actual-result: |
При повторном переходе в корзину, товар из оформленного ранее заказа остается в корзине
- summary: |
Не работает счетчик количества товара в наличии
environment: |
Microsoft Edge 126.0.2592.68 (Официальная сборка) (64-разрядная версия)
ОС Windows 23H2
steps-to-reproduce: |
1. Зайти на сайт магазина https://hexlet-products-store.vercel.app/
2. У товара "Eyeshadow Palette with Mirror" нажать несколько раз на кнопку "Add to cart"
3. Перейти в корзину нажав кнопку "Cart"
4. Оформить заказ нажав на кнопку "Checkout"
5. Выйти из формы оформления заказа нажав на кнопку "Close"
6. Перейти на главную страницу магазина нажав на вкладку "Store"
7. Перейти в карточку товара нажав на товар "Eyeshadow Palette with Mirror"
expected-result: |
Количество товара в карточке товара должно уменьшаться при оформлении заказов
actual-result: |
После оформления заказа, количество товара в карточке не уменьшается
- summary: |
Частично не работает перевод с аглийского языка на русский язык
environment: |
Microsoft Edge 126.0.2592.68 (Официальная сборка) (64-разрядная версия)
ОС Windows 23H2
steps-to-reproduce: |
1. Зайти на сайт магазина https://hexlet-products-store.vercel.app/
2. Нажать на кнопку "Language"
3. Выбрать язык "Русский"
4. Нажать на кнопку "Следующая"
5. Открыть выпадающий список категорий нажав на кнопку "Категория"
expected-result: |
Наименование, описание, а также категории товаров должны переводиться на русский язык
actual-result: |
Наименование товаров и описание остается на английском языке, раздел категория переводиться частично
- summary: |
Отсутствует адаптивность сайта к мобильным приложениям
environment: |
- Microsoft Edge 126.0.2592.68 (Официальная сборка) (64-разрядная версия)
ОС Windows 23H2
steps-to-reproduce: |
1. Зайти на сайт магазина https://hexlet-products-store.vercel.app/
2. Открыть DevTools одновременным нажатием клавиш Shift+Ctrl+I
3. В DevTools во вкладке элементы сменить тип/модель устройства:
- iPhone SE
- iPhone 12 Pro
- iPhone 14 Pro Max
- Samsung Galaxy S20 Ultra
- Samsung Galaxy S8+
- Asus Zenbook Fold
- iPad Air
4. С поможью кнопки "перевернуть" изменить положение сайта с вертикального на горизонтальный
expected-result: |
Сайт магазина должен адаптироваться под различные виды устройств
actual-result: |
Сайт магазина не адаптируется под другие устройства. При вертикальном положении не отобраается большая часть сайта. При горизонтальном картинки товаров растягиваются.
- summary: |
Возможность оформления заказа с отсутствующим товаром
environment: |
- Microsoft Edge 126.0.2592.68 (Официальная сборка) (64-разрядная версия)
ОС Windows 23H2
steps-to-reproduce: |
1. Зайти на сайт магазина https://hexlet-products-store.vercel.app/
2. В поисковой строке ввести "Lemon"
3. Убрать галочку "В наличии" (In Stock)
4. Открыть карточку товара "Lemon"
5. Надать "Add to cart"
3. Перейти в корзину нажав кнопку "Cart"
4. Оформить заказ нажав на кнопку "Checkout"
expected-result: |
Должна отсутствовать возможность добавления отсутствующего товара в корзину, а как следствие и возможность оформления заказа с отсутствующим товаром
actual-result: |
Можно добавить отсутствующий товар в корзину и оформить заказ
- summary: |
При переключении категорий нажатием кнопок "Следующая" "Предыдущая" отсутствует последовательность категорий и товаров
environment: |
- Microsoft Edge 126.0.2592.68 (Официальная сборка) (64-разрядная версия)
ОС Windows 23H2
steps-to-reproduce: |
1. Зайти на сайт магазина https://hexlet-products-store.vercel.app/
2. Нажать на кнопку  "Следующая" до окончания категорий
3. Нажать на кнопку "Предыдущая" до окончания категорий
expected-result: |
Категории товаров должны последовательно переключаться путем нажатия кнопок "Следующая" "Предыдущая". Товар в данных категориях должен оставаться в той же последовательности.
actual-result: |
При переключении категорий путем нажатия кнопок "Следующая" "Предыдущая" последовательность товаров и категорий меняется.
