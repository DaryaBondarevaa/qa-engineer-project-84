- summary: |
Не очищается корзина после оформления заказа
environment: |
Microsoft Edge 126.0.2592.68 (Официальная сборка) (64-разрядная версия)
ОС Windows 23H2
steps-to-reproduce: |
1. Добавить в корзину 3 товара
2. Перейти в корзину нажав кнопку "Cart"
3. Открыть DevTools
4. Оформить заказ нажав на кнопку "Checkout"
5. Выйти из формы оформления заказа нажав на кнопку "Close"
6. Обновить страницу
expected-result: |
Товар должен автоматически удаляться из корзины после оформления заказа
actual-result: |
После оформления заказа, товар не удаляется автоматически из корзины. DevTools - ошибка 500.

- summary: |
Не работает счетчик количества товара в наличии
environment: |
Microsoft Edge 126.0.2592.68 (Официальная сборка) (64-разрядная версия)
ОС Windows 23H2
steps-to-reproduce: |
1. У товара "Eyeshadow Palette with Mirror" нажать несколько раз на кнопку "Add to cart"
2. Перейти в корзину нажав кнопку "Cart"
3. Оформить заказ нажав на кнопку "Checkout"
4. Выйти из формы оформления заказа нажав на кнопку "Close"
5. Перейти на главную страницу магазина нажав на вкладку "Store"
6. Перейти в карточку товара нажав на товар "Eyeshadow Palette with Mirror"
expected-result: |
Количество товара в карточке товара должно уменьшаться при оформлении заказов
actual-result: |
После оформления заказа, количество товара в карточке не уменьшается

- summary: |
Не переводится описание товара на русский язык
environment: |
Microsoft Edge 126.0.2592.68 (Официальная сборка) (64-разрядная версия)
ОС Windows 23H2
steps-to-reproduce: |
1. Нажать на кнопку "Language"
2. Выбрать язык "Русский"
3. Нажать на кнопку "Следующая"
4. Открыть выпадающий список категорий нажав на кнопку "Категория"
expected-result: |
Описание товаров переводиться на русский язык
actual-result: |
Описание товаров остается на английском языке, раздел категория переводиться частично

- summary: |
Возможность оформления заказа с отсутствующим товаром
environment: |
- Microsoft Edge 126.0.2592.68 (Официальная сборка) (64-разрядная версия)
ОС Windows 23H2
steps-to-reproduce: |
1. В поисковой строке ввести "Lemon"
2. Убрать галочку "В наличии" (In Stock)
3. Открыть карточку товара "Lemon"
4. Надать "Add to cart"
5. Перейти в корзину нажав кнопку "Cart"
6. Оформить заказ нажав на кнопку "Checkout"
expected-result: |
Должна отсутствовать возможность добавления отсутствующего товара в корзину, а как следствие и возможность оформления заказа с отсутствующим товаром
actual-result: |
Можно добавить отсутствующий товар в корзину и оформить заказ

- summary: |
При переключении категорий нажатием кнопок "Следующая" "Предыдущая" отсутствует последовательность категорий и товаров
environment: |
- Microsoft Edge 126.0.2592.68 (Официальная сборка) (64-разрядная версия)
ОС Windows 23H2
steps-to-reproduce: |
1. Нажать на кнопку  "Следующая" до окончания категорий
2. Нажать на кнопку "Предыдущая" до окончания категорий
expected-result: |
Категории товаров должны последовательно переключаться путем нажатия кнопок "Следующая" "Предыдущая". Товар в данных категориях должен оставаться в той же последовательности.
actual-result: |
При переключении категорий путем нажатия кнопок "Следующая" "Предыдущая" последовательность товаров и категорий меняется.

